name: CI/CD Pipeline

# Trigger: run this workflow on every push to the "main" branch
on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Get the code from the repo
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Java so Maven can build the Spring Boot app
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # 3. Build and test the Spring Boot app
      - name: Build with Maven
        run: mvn -B clean package

      # 4. Log in to Docker Hub using GitHub Secrets
      #    (DOCKER_USERNAME and DOCKER_PASSWORD are set in repo Settings > Secrets)
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 5. Build the Docker image and push it to Docker Hub
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/demo-app:latest
            ${{ secrets.DOCKER_USERNAME }}/demo-app:${{ github.sha }}
